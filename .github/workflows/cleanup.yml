name: Cleanup Old Artifacts

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 3 AM UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const msPerDay = 24 * 60 * 60 * 1000;
            const cutoff = Date.now() - (7 * msPerDay);
            let deleted = 0;

            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            for (const artifact of artifacts.artifacts) {
              const created = new Date(artifact.created_at).getTime();
              if (created < cutoff) {
                console.log(`Deleting artifact: ${artifact.name} (created ${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted++;
              }
            }

            console.log(`Deleted ${deleted} artifact(s) older than 7 days.`);

      - name: Cleanup old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const msPerDay = 24 * 60 * 60 * 1000;
            const cutoff = Date.now() - (30 * msPerDay);
            let deleted = 0;

            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
              status: 'completed',
            });

            for (const run of runs.workflow_runs) {
              const created = new Date(run.created_at).getTime();
              if (created < cutoff) {
                console.log(`Deleting run: ${run.id} - ${run.name} (${run.created_at})`);
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                deleted++;
              }
            }

            console.log(`Deleted ${deleted} workflow run(s) older than 30 days.`);
